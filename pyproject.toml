[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steerablemorphology"
version = "0.1.0"
description = "Real-time control interface and differentiable digital twin for steering synthetic protocell morphogenesis."
readme = "README.md"
authors = [
  { name = "Intelligent Interfaces Group", email = "erick@media.mit.edu" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Life",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]
